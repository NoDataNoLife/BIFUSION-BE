spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: BIFUSION-BE
  profiles:
    # 기본 프로필 (배포 시: SPRING_PROFILES_ACTIVE=prod java -jar app.jar)
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # add-mappings: false만 있으면 매핑 없는 경로 요청 시 DispatcherServlet이 자동으로
  # NoHandlerFoundException을 던져 GlobalExceptionHandler에서 404로 처리한다.
  # (spring.mvc.throw-exception-if-no-handler-found는 Spring Boot 3.2부터 deprecated)
  web:
    resources:
      add-mappings: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: ${S3_BUCKET:bifusion-files-308664125879-ap-northeast-2-an}
        # presigned GET URL 만료 시간(분). 버킷이 private이라 응답 시 이 값으로 임시 URL을 발급한다.
        presign-duration-minutes: 10

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email

  # 폴링 스케줄러(1초 주기)가 임시 파일 정리·초대 만료 스케줄러를 막지 않도록 스레드를 나눈다.
  task:
    scheduling:
      pool:
        size: 3

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

# 대시보드 리소스 사용량 (GET /users/me/resource-usage)
usage:
  # 월간 집계 기간을 나누는 타임존
  timezone: Asia/Seoul

# 전문가 검수 신청 리워드(rewardPoints) 허용 범위. 검수 대상이 차지하는 스토리지 크기(MB, 올림)에 비례한다.
# - 증강 데이터: 증강 결과 데이터셋 파일 크기 / 업로드 데이터셋: 첨부 파일 크기
# - 최소 = max(min-points, MB × min-points-per-mb)
# - 최대 = min(max-points, max(base-max-points, MB × max-points-per-mb))
# 레시피나 크기를 알 수 없는 대상은 min-points ~ base-max-points. (임시 단가 1앤트 = 10원)
inspection:
  reward:
    min-points: 500
    base-max-points: 3000
    max-points: 10000
    min-points-per-mb: 10
    max-points-per-mb: 100

# 일회성: 대표 이미지가 비어 있는 기존 업로드 데이터셋에 첨부 파일에서 뽑은 대표 이미지를 채운다. 한 번 켜고 띄운 뒤 다시 끈다.
dataset:
  banner-backfill:
    enabled: ${DATASET_BANNER_BACKFILL_ENABLED:false}
  # 일회성: 파일 수가 0 또는 비어 있는 기존 업로드 데이터셋의 파일 수를 첨부 파일에서 세어 채운다. 한 번 켜고 띄운 뒤 다시 끈다.
  file-count-backfill:
    enabled: ${DATASET_FILE_COUNT_BACKFILL_ENABLED:false}

# 일회성: 다운로드 zip(결과 npz + PNG) 도입 전에 끝난 증강 결과의 zip을 만든다. 한 번 켜고 띄운 뒤 다시 끈다.
augmentation:
  zip-backfill:
    enabled: ${AUGMENTATION_ZIP_BACKFILL_ENABLED:false}

# 서비스 이용에 따른 포인트(앤트) 지급·차감. 임시 단가 1앤트 = 10원. 0으로 두면 그 항목은 지급·차감하지 않는다.
points:
  # 가입 시 지급 (결제 도입 전까지 처음 쓸 포인트)
  signup-bonus: 500
  # 다른 사람 레시피 포크: 포크한 사람 차감, 원본 작성자 지급 (수수료 10%)
  recipe-fork-cost: 30
  recipe-fork-reward: 27
  # 전문가 Q&A: 질문 등록 시 차감, 전문가 답변 시 지급 (질문 하나당 전문가 한 명에게 1회)
  qna-question-cost: 100
  qna-answer-reward: 90
  # 앤트 충전 (POST /api/v1/points/charge). 결제 연동 전 체험용이라 요청만으로 지급된다. 운영에서 막으려면 false
  charge:
    enabled: ${POINT_CHARGE_ENABLED:true}
    options: [500, 1000, 3000, 5000]

# AI 작업 실행 비용 (1토큰 = 1앤트). ML이 실제 사용량을 주지 않아 실행 파라미터로 계산량을 추정한다 (JobCostPolicy).
# 작업을 만들 때 차감하고, 실패·취소되면 전액 환불한다. 기본 설정 기준 증강 50, 학습 16, 추론 2 + 이미지 수.
job:
  cost:
    # base + ceil(finetune-steps / 20) + ceil(2 × num-samples-per-class × steps / 100)  (최대 설정 470)
    augmentation:
      base: 20
      finetune-steps-per-point: 20
      generation-steps-per-point: 100
    # base + ceil(epochs × episodes-per-epoch / 50)  (최대 설정 410)
    training:
      base: 10
      episodes-per-point: 50
    # base + 이미지 수 × points-per-image  (최대 20장 22)
    inference:
      base: 2
      points-per-image: 1

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  oauth2:
    frontend-uri: http://localhost:3000
  cookie:
    secure: false  # prod에서는 true로 변경
  admin:
    # 관리자(role = ADMIN)로 올릴 계정 이메일 (쉼표 구분). AdminRoleScheduler가 주기적으로 반영한다.
    emails: ${ADMIN_EMAILS:bifusionlab@gmail.com}

ml:
  # ML 서버(RunPod) 주소. 비어 있으면 ML 호출은 모두 연결 실패(ML_CONNECTION_FAILED)로 처리된다.
  base-url: ${ML_BASE_URL:}
  # 비어 있으면 X-API-Key 헤더를 붙이지 않는다.
  api-key: ${ML_API_KEY:}
  connect-timeout: 5s
  # 실행 요청은 Base64 이미지 본문(최대 약 27MB)을 보내므로 넉넉히 잡는다.
  # 요청 시작부터 재는 값이라 connect-timeout보다 충분히 길어야 연결 실패와 응답 지연(접수 여부 불확실)이 구분된다.
  read-timeout: 60s
  # ML 접수 후 PENDING 유지 허용 시간. 큐별 동시 실행이 1개라 정상 대기도 길 수 있다.
  pending-timeout: ${ML_PENDING_TIMEOUT:6h}
  # Base64 변환 전 입력 이미지 총 용량 상한 (ML 요청 1건 기준)
  max-input-size: 20MB
  # 요청에서 생략된 파라미터는 아래 값으로 채워 ML에 명시적으로 보낸다. (증강 seed는 비어 있으면 랜덤 생성)
  defaults:
    augmentation:
      num-samples-per-class: 10
      strength: 0.3
      finetune-steps: 400
      steps: 50
    training:
      k-shot: 5
      epochs: 30
      q-query: 5
      episodes-per-epoch: 10
      seed: 42
  # Job 생성 요청 검증 범위. 상한값(finetune-steps·steps·epochs·q-query·episodes-per-epoch)은 ML 담당자 확인 필요
  limits:
    augmentation:
      min-images-per-class: 5
      max-images-per-class: 10
      min-num-samples-per-class: 1
      max-num-samples-per-class: 100
      min-strength: 0.0
      max-strength: 1.0
      max-finetune-steps: 1000
      max-steps: 200
    training:
      k-shot-options: [1, 3, 5, 10]
      max-epochs: 200
      max-q-query: 20
      max-episodes-per-epoch: 100
    inference:
      min-images: 1
      max-images: 20
  # ML 작업 상태 폴링 스케줄러. pending-timeout(위)은 ML 접수 후 PENDING 유지 허용 시간으로 함께 쓴다.
  polling:
    interval: 1s
    batch-size: 50
    # mlJobId 없는 PENDING Job(실행 요청 전에 서버가 죽은 경우)을 실패로 보는 기준 (생성 시각부터)
    launch-timeout: 10m
    # ML이 계속 RUNNING만 돌려줄 때(워커 멈춤)의 상한 (ML 접수 시각부터)
    running-timeout: 72h
    # ML이 PENDING을 이 시간 넘게 돌려주면 경고 로그 (ML 큐 대기·작업 유실 확인용, 같은 간격으로 반복)
    pending-warn-after: 1m
    # ML 연결 불가(연결 오류·5xx·프록시 404)가 이 시간 넘게 이어지면 진행 중 Job을 ML_UNREACHABLE로 실패 처리
    unreachable-timeout: ${ML_UNREACHABLE_TIMEOUT:1m}
  cancel:
    # ML 취소 엔드포인트 배포 전까지 false. false면 취소 API는 검증 후 503, 폴러의 타임아웃 취소 호출도 생략
    enabled: ${ML_CANCEL_ENABLED:false}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json