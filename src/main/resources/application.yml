spring:
  application:
    name: BIFUSION-BE
  profiles:
    # 기본 프로필 (배포 시: SPRING_PROFILES_ACTIVE=prod java -jar app.jar)
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  cloud:
    aws:
      region:
        static: ap-northeast-2
      s3:
        bucket: bifusion-files-959222626767-ap-northeast-2-an

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json