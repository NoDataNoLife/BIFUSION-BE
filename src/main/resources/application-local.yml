spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bifusion
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # 로컬 개발 환경 전용 AWS 인증 설정
  # 배포 시 액세스 키는 삭제
  # EC2/ECS/Lambda에 IAM 역할로 S3 권한 부여
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}

logging:
  level:
    root: INFO
    com.nodatanolife.bifusion_be: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE