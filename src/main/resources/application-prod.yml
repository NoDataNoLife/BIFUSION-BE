spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/bifusion
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # TODO: 최초 배포로 테이블 생성 후 validate로 전환할 것 (마이그레이션 도구 미도입)
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # prod에서는 AWS access-key를 넣지 않음
  # EC2 인스턴스에 IAM Role을 부여해서 Spring Cloud AWS가 자동으로 자격증명을 획득하도록 함

server:
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.nodatanolife.bifusion_be: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

app:
  cors:
    allowed-origins: https://bifusion-fe-whb3.vercel.app
  oauth2:
    frontend-uri: https://bifusion-fe-whb3.vercel.app
  cookie:
    secure: true
