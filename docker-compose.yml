version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: bifusion-db
    environment:
      POSTGRES_DB: bifusion
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 0000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: