# EC2 호스트에 직접 설치하는 nginx 설정 (/etc/nginx/sites-available/bifusion-be.conf)
# 설치:
#   sudo apt update && sudo apt install -y nginx
#   sudo cp nginx/bifusion-be.conf /etc/nginx/sites-available/bifusion-be.conf
#   sudo ln -s /etc/nginx/sites-available/bifusion-be.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 지금은 도메인이 없어 IP(13.125.194.83) 기반 HTTP만 서비스한다.
# 도메인을 연결한 뒤에는 server_name을 도메인으로 바꾸고 아래 명령으로 인증서를 발급하면
# certbot이 이 파일에 HTTPS 서버 블록과 80->443 리다이렉트를 자동으로 추가해준다.
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d <도메인>
# 인증서 적용 후에는 application-prod.yml의 app.cookie.secure를 true로 전환할 것.

server {
    listen 80 default_server;
    server_name _;

    # application.yml의 spring.servlet.multipart.max-request-size와 맞춤
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
