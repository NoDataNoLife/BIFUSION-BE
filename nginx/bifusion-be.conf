# EC2 호스트에 직접 설치하는 nginx 설정 (/etc/nginx/sites-available/bifusion-be.conf)
# 운영 서버(bifusion.duckdns.org → EIP 3.37.103.56)의 실제 파일과 같은 내용이다. 서버에서 바꾸면 이 파일도 맞춘다.
#
# 처음 설치할 때:
#   sudo apt update && sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp nginx/bifusion-be.conf /etc/nginx/sites-available/bifusion-be.conf
#   sudo ln -s /etc/nginx/sites-available/bifusion-be.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# 인증서(/etc/letsencrypt)가 없는 새 서버에서는 "managed by Certbot" 줄을 빼고 80 서버 블록만 둔 채 띄운 뒤
#   sudo certbot --nginx -d bifusion.duckdns.org
# 를 실행하면 certbot이 아래와 같은 443 블록과 80->443 리다이렉트를 다시 만든다.
#
# apt로 설치한 certbot은 자동 갱신 타이머(certbot.timer)를 등록한다.
# 갱신 확인: systemctl list-timers | grep certbot, sudo certbot renew --dry-run
# HTTPS 전제로 application-prod.yml의 app.cookie.secure는 true다.

server {
    server_name bifusion.duckdns.org;

    # application.yml의 spring.servlet.multipart.max-request-size와 맞춤
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bifusion.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bifusion.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = bifusion.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name bifusion.duckdns.org;
    return 404; # managed by Certbot


}
